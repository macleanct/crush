<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Name Checker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: white;
    font-family: Arial, Helvetica, sans-serif;
    transition: background-color 0.25s ease;
}

#container {
    text-align: center;
}

input {
    width: 320px;
    padding: 15px;
    font-size: 24px;
    text-align: center;
    border: 2px solid #444;
    border-radius: 8px;
    outline: none;
}

#result {
    margin-top: 30px;
    font-size: 80px;
    font-weight: bold;
    color: white;
    opacity: 0;
    transition: opacity .2s;
    user-select: none;
}
</style>
</head>

<body>

<div id="container">
    <input
        id="nameInput"
        type="text"
        placeholder="Enter a name"
        autofocus
    >
    <div id="result"></div>
</div>

<script>
// =======================================
// EDIT THIS LIST
// Any name here will return YES.
// Everything else returns NO.
// =======================================

const approvedNames = [
    "Juan Vargas",
    "Zoe Stricker",
    "Luke O'Halloran",
    "AJ"
].map(n => n.toLowerCase());

// =======================================

const input = document.getElementById("nameInput");
const result = document.getElementById("result");

input.focus();

input.addEventListener("keydown", function(e){

    if(e.key !== "Enter") return;

    const name = input.value.trim().toLowerCase();

    if(approvedNames.includes(name)){
        document.body.style.backgroundColor = "#18b318";
        result.textContent = "YES";
    }
    else{
        document.body.style.backgroundColor = "#d7191c";
        result.textContent = "NO";
    }

    result.style.opacity = "1";

    // Automatically reset after 3 seconds
    setTimeout(() => {
        document.body.style.backgroundColor = "white";
        result.style.opacity = "0";
        input.value = "";
        input.focus();
    }, 3000);

});

</script>

</body>
</html>
